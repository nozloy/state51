name: Build and publish container

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Generate image tags and labels
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long,priority=1000
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build image and load it for testing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          target: runner
          platforms: linux/amd64
          load: true
          tags: |
            state51:ci
            ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_YANDEX_METRICA_ID=${{ vars.NEXT_PUBLIC_YANDEX_METRICA_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the production container
        shell: bash
        run: |
          trap 'docker logs state51-smoke; docker rm --force state51-smoke >/dev/null' EXIT
          docker run --detach --name state51-smoke \
            --publish 127.0.0.1:3000:3000 \
            --health-interval 2s --health-start-period 5s \
            state51:ci

          for attempt in {1..30}; do
            status="$(docker inspect --format '{{.State.Health.Status}}' state51-smoke)"
            if [ "$status" = healthy ]; then
              curl --fail --silent --show-error --output /dev/null http://127.0.0.1:3000/
              curl --fail --silent --show-error --output /dev/null http://127.0.0.1:3000/3angle.png
              exit 0
            fi
            if [ "$status" = unhealthy ]; then
              break
            fi
            sleep 2
          done

          echo '::error::The production container did not become healthy.'
          exit 1

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the tested image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
        shell: bash
        run: |
          while IFS= read -r tag; do
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
          printf 'Published image tags:\n```text\n%s\n```\n' "$IMAGE_TAGS" >> "$GITHUB_STEP_SUMMARY"

      - name: Request Coolify deployment (optional)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        shell: bash
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ] && [ -z "$COOLIFY_TOKEN" ]; then
            echo 'Image published. Set COOLIFY_WEBHOOK and COOLIFY_TOKEN to enable automatic deployment.'
            exit 0
          fi
          if [ -z "$COOLIFY_WEBHOOK" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo '::error::Automatic deployment requires both COOLIFY_WEBHOOK and COOLIFY_TOKEN.'
            exit 1
          fi

          curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 40 \
            --request GET \
            --header "Authorization: Bearer $COOLIFY_TOKEN" \
            "$COOLIFY_WEBHOOK"
