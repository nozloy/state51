services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      YC_PARTNER_TOKEN: ${YC_PARTNER_TOKEN:?YC_PARTNER_TOKEN is required}
      YC_USER_TOKEN: ${YC_USER_TOKEN:?YC_USER_TOKEN is required}
      YC_COMPANY_ID: ${YC_COMPANY_ID:?YC_COMPANY_ID is required}
      YC_GROUP_ID: ${YC_GROUP_ID:?YC_GROUP_ID is required}
      YC_ADMIN_LOGIN: ${YC_ADMIN_LOGIN:?YC_ADMIN_LOGIN is required}
      YC_ADMIN_PASSWORD: ${YC_ADMIN_PASSWORD:?YC_ADMIN_PASSWORD is required}
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const http=require('http');http.get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
